[package]
name = "bml-cli"
# Historical components retain their experimental version.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bml-domain = { path = "../domain" }
bml-compiler = { path = "../compiler" }
bml-runtime = { path = "../runtime" }
bml-parser = { path = "../parser" }
bml-model-weights = { path = "../model-weights", features = ["gguf-import"] }
clap.workspace = true

[lib]
name = "bml_cli"
path = "src/lib.rs"
