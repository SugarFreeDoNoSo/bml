[package]
name = "bml-runtime"
# Historical components retain their experimental version.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
loom = ["dep:loom"]

[dependencies]
loom = { workspace = true, optional = true }
bml-domain = { path = "../domain" }
bml-compiler = { path = "../compiler" }
bml-queue = { path = "../queue" }
bml-model-weights = { path = "../model-weights" }
crossbeam.workspace = true

[dev-dependencies]
bml-model-weights = { path = "../model-weights", features = ["gguf-import"] }
loom.workspace = true
proptest.workspace = true
serde_json.workspace = true
