[package]
name = "bml-server"
# Historical components retain their experimental version.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bml-compiler = { path = "../compiler" }
bml-parser = { path = "../parser" }
bml-runtime = { path = "../runtime" }
bml-inference = { path = "../inference" }
bml-gguf = { path = "../gguf", default-features = false }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = "0.1"

[[bin]]
name = "bml-server"
path = "src/main.rs"

[dev-dependencies]
sha2 = "0.10"
