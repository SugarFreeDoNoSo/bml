[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/parser",
    "crates/compiler",
    "crates/runtime",
    "crates/bench",
    "crates/tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SugarFreeDoNoSo/bml"

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true

[workspace.dependencies]
criterion = "0.5"
proptest = "1"
ndarray = "0.16"
loom = "0.7"
crossbeam = "0.8"
